<head>

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">

<!-- Header / Navbar -->

<section class="py-5">

        <div id="annulerIcone" style="font-size: 3rem; color: #227093;">
            <i class="fas fa-spinner fa-spin"></i>
        </div>
        <h1 id="annulerTitre" class="mt-3 mb-3" style="color: #111111;">Annulation en cours…</h1>
        <p id="annulerMessage">Un instant, on traite votre demande.</p>
        <p class="mt-4">
            <a href="cours-planing.html" class="btn btn-primary">Retour au planning</a>
        </p>
    </div>
</section>

<script src="../components/footer.js"></script>

<!-- Bouton retour en haut -->

    <i class="fas fa-chevron-up"></i>
</button>

<script src="../js/main.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="../js/scroll-top.js"></script>
<script src="../js/cookies.js"></script>

<!-- Annulation via le lien reçu par email -->
<script type="module">
  const EDGE_URL = 'https://djjaxrlsgulaqawzskbu.supabase.co/functions/v1/annuler';
  const SUPABASE_KEY = 'sb_publishable_CPnHYFaVVnrcvhV6nUDeAw_8eDVVlKJ';

  const icone = document.getElementById('annulerIcone');
  const titre = document.getElementById('annulerTitre');
  const message = document.getElementById('annulerMessage');

  function afficher(succes, titreTxt, messageTxt) {
    icone.innerHTML = succes
      ? '<i class="fas fa-circle-check" style="color:#1e7e40;"></i>'
      : '<i class="fas fa-circle-xmark" style="color:#b23225;"></i>';
    titre.textContent = titreTxt;
    message.textContent = messageTxt;
  }

  const token = new URLSearchParams(window.location.search).get('t');

  if (!token) {
    afficher(false, 'Lien invalide', "Ce lien d'annulation est incomplet. Vérifiez que vous avez copié l'adresse en entier depuis l'email.");
  } else {
    try {
      const res = await fetch(EDGE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_KEY}` },
        body: JSON.stringify({ token }),
      });
      const data = await res.json();

      if (data.ok) {
        afficher(true, 'Inscription annulée', 'Votre place a bien été libérée. Merci de nous avoir prévenus !');
      } else if (data.raison === 'introuvable_ou_deja_annulee') {
        afficher(false, 'Déjà annulée', 'Cette inscription a déjà été annulée, ou ce lien a déjà été utilisé.');
      } else {
        afficher(false, 'Oups', "L'annulation a échoué. Écrivez-nous à moovensemble@gmail.com.");
      }
    } catch (e) {
      afficher(false, 'Oups', "L'annulation a échoué. Écrivez-nous à moovensemble@gmail.com.");
    }
  }
</script>

</body>
</html>
