<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Moov'Ensemble Admin</title>
    <link rel="icon" type="image/png" href="../assets/images/logo/petit-logo_sans_fond.png">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-page">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <h2>Moov'Ensemble</h2>
            <span>Administration</span>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item active">
                <span class="icon">📊</span> Dashboard
            </a>
            <a href="seances.html" class="nav-item">
                <span class="icon">📅</span> Séances
            </a>
        </nav>
        <button class="btn-logout" id="logoutBtn">Se déconnecter</button>
    </aside>

    <!-- Contenu principal -->
    <main class="main-content">

        <header class="page-header">
            <h1>Vue générale</h1>
            <span id="dateAujourdhui"></span>
        </header>

        <!-- Cartes statistiques -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Séances avec inscriptions</div>
                <div class="stat-value" id="totalSeances">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Inscriptions confirmées</div>
                <div class="stat-value" id="totalConfirmees">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Séances complètes</div>
                <div class="stat-value" id="totalCompletes">—</div>
            </div>
        </div>

        <!-- Dernières inscriptions -->
        <div class="section-card">
            <h2>Dernières inscriptions</h2>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Nom</th>
                        <th>Cours</th>
                        <th>Séance</th>
                        <th>Statut</th>
                        <th>Inscrit le</th>
                    </tr>
                </thead>
                <tbody id="dernieresInscriptions">
                    <tr><td colspan="5">Chargement...</td></tr>
                </tbody>
            </table>
            <p style="margin-top:16px;"><a href="seances.html" class="btn-secondary" style="text-decoration:none; display:inline-block;">Voir toutes les séances →</a></p>
        </div>

    </main>

    <script type="module">
        import { supabase } from './js/config.js'

        // Vérifier si connecté
        const { data: { user } } = await supabase.auth.getUser()
        if (!user) window.location.href = 'index.html'

        // Date du jour
        document.getElementById('dateAujourdhui').textContent =
            new Date().toLocaleDateString('fr-CH', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })

        function labelDate(dateStr) {
            const d = new Date(dateStr + 'T00:00:00')
            const s = d.toLocaleDateString('fr-CH', { day: 'numeric', month: 'short' })
            return s
        }

        const aujourdhui = new Date().toISOString().slice(0, 10)

        const { data: sessions, error } = await supabase
            .from('sessions')
            .select('cours, date, heure_debut, capacite, reservations(nom, statut, created_at)')
            .gte('date', aujourdhui)

        const tbody = document.getElementById('dernieresInscriptions')

        if (error || !sessions) {
            console.error(error)
            document.getElementById('totalSeances').textContent = '—'
            document.getElementById('totalConfirmees').textContent = '—'
            document.getElementById('totalCompletes').textContent = '—'
            tbody.innerHTML = '<tr><td colspan="5">Impossible de charger les inscriptions.</td></tr>'
        } else {
            const totalConfirmees = sessions.reduce(
                (n, s) => n + s.reservations.filter(r => r.statut === 'confirmee').length, 0
            )
            const totalCompletes = sessions.filter(
                s => s.reservations.filter(r => r.statut === 'confirmee').length >= s.capacite
            ).length

            document.getElementById('totalSeances').textContent = sessions.length
            document.getElementById('totalConfirmees').textContent = totalConfirmees
            document.getElementById('totalCompletes').textContent = totalCompletes

            const dernieres = sessions
                .flatMap(s => s.reservations.map(r => ({ ...r, cours: s.cours, date: s.date, heure: s.heure_debut })))
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
                .slice(0, 5)

            if (dernieres.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5">Aucune inscription pour l\'instant</td></tr>'
            } else {
                tbody.innerHTML = dernieres.map(r => `
                    <tr>
                        <td>${r.nom}</td>
                        <td>${r.cours}</td>
                        <td>${labelDate(r.date)} · ${(r.heure || '').slice(0, 5)}</td>
                        <td><span class="badge ${r.statut === 'confirmee' ? 'badge-actif' : 'badge-inactif'}">${r.statut === 'confirmee' ? 'Confirmée' : 'Annulée'}</span></td>
                        <td>${new Date(r.created_at).toLocaleDateString('fr-CH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</td>
                    </tr>
                `).join('')
            }
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabase.auth.signOut()
            window.location.href = 'index.html'
        })
    </script>

</body>
</html>
