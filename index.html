    <!-- Logo principal : bascule vers la version colorée au survol de la carte -->
    <script>
        const hand = document.querySelector('.hand');
        const cards = document.querySelectorAll('.hand .card');
        const logoDefault = document.getElementById('logo-v-default');
        const logoMap = [
            document.getElementById('logo-v-seniors'),
            document.getElementById('logo-v-adultes'),
            document.getElementById('logo-v-enfants')
        ];
        const allLogos = [logoDefault, ...logoMap];

        // Correspondance carte → fichier logo (même ordre que les cartes)
        const navLogoMap = [
            'Moov-Vital.png',   // Seniors
            'Moov-Ladies.png',  // Adultes
            'Moov-Capoeira.png' // Enfants
        ];

        function showLogo(el, navFilename) {
            allLogos.forEach(l => l.classList.remove('active'));
            el.classList.add('active');
            if (window.moovSetNavLogo) window.moovSetNavLogo(navFilename);
        }

        cards.forEach((card, i) => {
            card.addEventListener('mouseenter', () => showLogo(logoMap[i], navLogoMap[i]));
        });

        // Réinitialise uniquement quand la souris quitte tout le groupe de cartes
        hand.addEventListener('mouseleave', () => showLogo(logoDefault, 'Logo-original.png'));
    </script>
